[package]
name = "mailcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "MailCraft user interface (egui)"

[lints]
workspace = true

[dependencies]
egui = { workspace = true, features = ["default_fonts"] }
serde = { workspace = true }
craft-settings = { workspace = true }
log = { workspace = true }
sys-locale = "0.3"
mailcraft-store = { workspace = true }
mailcraft-sync = { workspace = true }
mailcraft-graph = { workspace = true }
mailcraft-imap = { workspace = true }
mailcraft-ai = { workspace = true }
chrono = { workspace = true }
mailcraft-html = { workspace = true }
base64 = { workspace = true }
rfd = { workspace = true }
egui_extras = { workspace = true }
image = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Reads the Windows accent colour (safe API; the workspace forbids unsafe).
winreg = "0.55"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu"] }
tempfile = { workspace = true }
craft-settings = { workspace = true }
