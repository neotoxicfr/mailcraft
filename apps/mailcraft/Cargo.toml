[package]
name = "mailcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "MailCraft desktop app"

[lints]
workspace = true

[dependencies]
mailcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
log = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Original view of a message: Edge WebView2 as a child of the main window.
wry = { workspace = true }
# Safe Win32 calls: cuts the menus out of the original view (a native window over ours).
winsafe = { version = "0.0.29", features = ["gdi", "user", "kernel"] }
open = { workspace = true }
# Notification-area icon (with its menu) and new-mail notifications.
tray-icon = "0.26"
tauri-winrt-notification = "0.8"

[build-dependencies]
# Renders assets/app-icon/mailcraft.svg (pure Rust).
resvg = "0.49"

[target.'cfg(windows)'.build-dependencies]
# Icon + VERSIONINFO for mailcraft.exe.
winresource = "0.1"
ico = "0.6"
