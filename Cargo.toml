[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/mailcraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/neotoxicfr/mailcraft"

[workspace.dependencies]
# internal
mailcraft-ui-egui = { path = "crates/ui-egui" }
mailcraft-store = { path = "crates/store" }
mailcraft-graph = { path = "crates/graph" }
mailcraft-sync = { path = "crates/sync" }
mailcraft-html = { path = "crates/html" }
mailcraft-analysis = { path = "crates/analysis" }

# reading: HTML parsing, original view (Edge WebView2), attachments
scraper = { version = "0.29", default-features = false }
wry = { version = "0.57", default-features = false }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
open = "5.4"
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# storage: SQLCipher, built with its bundled libtomcrypt provider (see vendor/libsqlite3-sys)
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }
keyring-core = "1"
windows-native-keyring-store = "1.1"
aes-gcm = "0.11"
getrandom = "0.4"
# network: rustls on ring, as in rustcraft-manager (no aws-lc build tools needed)
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "blocking", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"
url = "2.5"
webbrowser = "1.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"

# Every craft-libs crate comes from one storytold/craft-libs revision, the one GridCraft pins.
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }

serde = { version = "1", features = ["derive"] }
log = "0.4"
egui = "0.37"
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Same reviewed egui/winit fork commits as GridCraft and WordCraft, so MailCraft can join the suite.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# SQLCipher on libtomcrypt instead of OpenSSL; the only change is in build.rs (marked "MailCraft patch").
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
